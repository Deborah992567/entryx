name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          cd backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -e ".[dev]"
      - name: Run all tests with coverage
        run: |
          cd backend
          source .venv/bin/activate
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=85

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -e ".[dev]"
      - name: Ruff check
        run: |
          cd backend
          source .venv/bin/activate
          ruff check app/ tests/
      - name: Ruff format check
        run: |
          cd backend
          source .venv/bin/activate
          ruff format --check app/ tests/

  backend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -e ".[dev]"
      - name: Pyright
        run: |
          cd backend
          source .venv/bin/activate
          pyright app/

  frontend-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter analyze
        run: |
          cd frontend
          flutter pub get
          flutter analyze --fatal-infos
      - name: Flutter test
        run: |
          cd frontend
          flutter test
